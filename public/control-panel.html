<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Avance nacional</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-body">
  <header class="app-header">
    <div class="app-header-title">
      <h1>Avance nacional</h1>
    </div>
    <button type="button" id="logout-btn" class="btn btn-secondary">Cerrar sesión</button>
  </header>

  <main class="app-main">
    <section class="progress-section national-summary" id="national-summary" aria-label="Resumen nacional">
      <p>Cargando resumen…</p>
    </section>

    <div id="table-status" class="table-status" hidden></div>

    <div class="table-wrap">
      <table class="unidades-table sortable-table" id="resumen-table">
        <thead>
          <tr>
            <th data-sort="estado">Entidad</th>
            <th data-sort="total">Total</th>
            <th data-sort="capturadas">Capturadas</th>
            <th data-sort="porcentaje">% Avance</th>
            <th data-sort="incluidas">Incluyen</th>
            <th data-sort="excluidas">Excluyen</th>
            <th data-sort="ratificadas">Ratifican</th>
            <th data-sort="manuales">Sin CLUES</th>
            <th data-sort="ultimoEnvio">Último envío</th>
          </tr>
        </thead>
        <tbody id="resumen-tbody">
        </tbody>
      </table>
    </div>
  </main>

  <script src="js/control-panel.js"></script>
</body>
</html>
