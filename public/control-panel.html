<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Avance nacional</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="report-page">
  <header class="report-header">
    <div class="report-brand">Modificación al Anexo 1 del Convenio de Coordinación</div>
    <button type="button" id="logout-btn" class="report-logout">Cerrar sesión</button>
  </header>

  <main class="report-body">
    <section class="hero" id="national-summary" aria-label="Resumen nacional">
      <p class="hero-loading">Cargando resumen…</p>
    </section>

    <section class="insights-grid" id="story-focus-grid" aria-label="Focos ejecutivos">
    </section>

    <section class="operations-section" aria-label="Detalle operativo por entidad">
      <div class="operations-header">
        <div>
          <p class="eyebrow">Detalle bajo demanda</p>
          <h2 id="operations-title">Las 25 entidades, de menor a mayor avance</h2>
        </div>
        <div class="quick-filters" id="quick-filters" aria-label="Filtros rapidos">
          <button type="button" class="filter-chip is-active" data-filter="all">Todos</button>
          <button type="button" class="filter-chip" data-filter="pending">Sin enviar</button>
          <button type="button" class="filter-chip" data-filter="sent">Enviados</button>
          <button type="button" class="filter-chip" data-filter="observations">Con observaciones</button>
        </div>
      </div>

      <div class="view-switcher" id="view-switcher" aria-label="Cambiar tipo de vista">
        <button type="button" class="view-btn is-active" data-view="table">Tabla</button>
        <button type="button" class="view-btn" data-view="pct-all">Avance %</button>
        <button type="button" class="view-btn" data-view="abs-all">Avance en unidades</button>
        <button type="button" class="view-btn" data-view="pending">Sin enviar</button>
        <button type="button" class="view-btn" data-view="sent">Enviados</button>
      </div>

      <div id="table-status" class="table-status" hidden></div>

      <div class="chart-container" id="chart-container" hidden></div>

      <div class="table-scroll" id="table-scroll-wrap">
        <table class="report-table sortable-table" id="resumen-table">
          <thead>
            <tr>
              <th data-sort="estado">Entidad</th>
              <th data-sort="total">Total</th>
              <th data-sort="capturadas">Capturadas</th>
              <th data-sort="porcentaje">% Avance</th>
              <th data-sort="incluidas">Incluyen</th>
              <th data-sort="excluidas">Excluyen</th>
              <th data-sort="ratificadas">Ratifican</th>
              <th data-sort="manuales">Sin CLUES</th>
              <th data-sort="ultimoEnvio">Último envío</th>
            </tr>
          </thead>
          <tbody id="resumen-tbody">
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/control-panel.js"></script>
</body>
</html>
