<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión - Modificación al Anexo 1 del Convenio de Coordinación</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <main class="login-card">
    <h1 class="login-title">Modificación al Anexo 1 del Convenio de Coordinación</h1>
    <p class="login-subtitle">Inicia sesión con la contraseña de tu entidad federativa</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="estado">Entidad federativa</label>
        <select id="estado" name="estado" required disabled>
          <option value="">Cargando entidades…</option>
        </select>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div id="login-error" class="alert alert-error" role="alert" hidden></div>

      <button type="submit" id="login-submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
