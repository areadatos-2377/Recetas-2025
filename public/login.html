<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión - Modificación al Anexo 1 del Convenio de Coordinación</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <main class="login-card">
    <h1 class="login-title">Modificación al Anexo 1 del Convenio de Coordinación</h1>
    <p class="login-subtitle">Inicia sesión con la contraseña de tu entidad federativa o unidad</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="estado">Entidad federativa o unidad</label>
        <select id="estado" name="estado" required disabled>
          <option value="">Cargando entidades…</option>
        </select>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div id="login-error" class="alert alert-error" role="alert" hidden></div>

      <button type="submit" id="login-submit" class="btn btn-primary btn-block">Entrar</button>
    </form>

    <a class="login-manual-link" href="https://serviciossaludimssbienestar.sharepoint.com/sites/UDD_Teams/Shared%20Documents/Forms/AllItems.aspx?id=%2Fsites%2FUDD%5FTeams%2FShared%20Documents%2FDra%2E%20Nazarea%2FModificacion%5FAnexo1%2FMANUAL%20Anexo%201&viewid=68ffe118%2D5979%2D491a%2D9b9d%2Dfe4dacc7cd57" target="_blank" rel="noopener noreferrer">
      <svg class="login-manual-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
      <span class="login-manual-text">
        <strong>Consultar manual de usuario</strong>
        <small>Guía paso a paso para capturar tu información</small>
      </span>
    </a>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
