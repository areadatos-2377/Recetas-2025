<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Acceso</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">
  <main class="login-card">
    <h1 class="login-title">Acceso</h1>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>

      <div id="login-error" class="alert alert-error" role="alert" hidden></div>

      <button type="submit" id="login-submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
  </main>

  <script src="js/control-login.js"></script>
</body>
</html>
