<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Censo de Unidades Médicas</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-body">
  <header class="app-header">
    <div class="app-header-title">
      <h1>Censo de Unidades Médicas</h1>
      <span id="estado-nombre" class="estado-badge">—</span>
    </div>
    <button type="button" id="logout-btn" class="btn btn-secondary">Cerrar sesión</button>
  </header>

  <main class="app-main">
    <section class="progress-section" aria-label="Progreso de captura">
      <div class="progress-info">
        <span id="progress-text">Cargando progreso…</span>
      </div>
      <div class="progress-bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progress-bar-track">
        <div class="progress-bar-fill" id="progress-bar-fill" style="width: 0%"></div>
      </div>
    </section>

    <section class="toolbar">
      <div class="search-field">
        <input type="search" id="search-input" placeholder="Buscar por CLUES o nombre del tipo de establecimiento…" aria-label="Buscar unidad">
      </div>
      <button type="button" id="enviar-btn" class="btn btn-primary">Enviar información</button>
    </section>

    <div id="table-status" class="table-status" hidden></div>

    <div class="table-wrap">
      <table class="unidades-table" id="unidades-table">
        <thead>
          <tr>
            <th class="col-clues">CLUES</th>
            <th class="col-nombre">Nombre tipo establecimiento</th>
            <th class="col-nombre-unidad">Nombre de la unidad</th>
            <th class="col-estatus">Estatus</th>
          </tr>
        </thead>
        <tbody id="unidades-tbody">
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal de confirmación de envío -->
  <div id="confirm-modal" class="modal-overlay" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
      <h2 id="confirm-modal-title">Confirmar envío</h2>
      <div id="confirm-modal-body" class="modal-body">
        <p>Cargando resumen…</p>
      </div>
      <div id="confirm-modal-result" class="modal-result" hidden></div>
      <div class="modal-actions">
        <button type="button" id="confirm-cancel-btn" class="btn btn-secondary">Cancelar</button>
        <button type="button" id="confirm-send-btn" class="btn btn-primary">Confirmar y enviar</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
